<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Başar! · İndir</title>
<meta name="description" content="Başar! App Store'da. Odaklan, adan büyüsün.">
<link rel="icon" href="../favicon-64.png">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d152a;color:#f0f3f9;text-align:center}
  .box{max-width:380px;padding:28px 20px;display:flex;flex-direction:column;gap:16px;align-items:center}
  img{width:112px;height:112px;border-radius:24px}
  h1{margin:0;font-size:28px}
  p{margin:0;color:#a8b2c7;font-size:15px;line-height:1.5}
  a.btn{display:block;width:100%;box-sizing:border-box;padding:15px;border-radius:12px;background:#5fd3a6;color:#0d152a;font-weight:700;font-size:17px;text-decoration:none}
  a.sub{color:#a8b2c7;font-size:15px}
</style>
</head>
<body>
<div class="box">
  <img src="../icon-192.png" alt="Başar!">
  <h1>Başar!</h1>
  <p id="msg">Odaklan, adan büyüsün. İlk 3 gün ücretsiz.</p>
  <a class="btn" id="go" href="https://apps.apple.com/app/id6821430105">App Store'dan indir</a>
  <p id="gp">Google Play sürümü yakında.</p>
  <a class="sub" href="https://basarapp.com/">basarapp.com</a>
</div>
<script>
// iPhone/iPad'de doğrudan App Store açılır; diğer cihazlarda bu sayfa kalır.
(function(){
  var ua=navigator.userAgent||"", ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  if(!/^tr/i.test(navigator.language||"tr")){
    document.documentElement.lang="en";
    document.getElementById("msg").textContent="Focus, and watch your island grow. Free for the first 3 days.";
    document.getElementById("go").textContent="Download on the App Store";
    document.getElementById("gp").textContent="Google Play version coming soon.";
  }
  if(ios) setTimeout(function(){ location.replace("https://apps.apple.com/app/id6821430105"); }, 300);
})();
</script>
</body>
</html>

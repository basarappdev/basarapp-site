<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>YouTube'da açılıyor · Tunç Kurt Matematik</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d152a;color:#f0f3f9;text-align:center}
  .box{max-width:420px;padding:28px 20px;display:flex;flex-direction:column;gap:18px;align-items:center}
  img{width:100%;max-width:420px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#1d2a44}
  a.btn{display:block;width:100%;padding:16px;border-radius:12px;background:#ff0033;color:#fff;font-weight:700;font-size:18px;text-decoration:none}
  a.sub{color:#a8b2c7;font-size:15px}
  p{margin:0;color:#a8b2c7;font-size:15px}
</style>
</head>
<body>
<div class="box">
  <img id="th" alt="">
  <a class="btn" id="go" href="https://www.youtube.com/@tunckurtmatematik">YouTube uygulamasında aç</a>
  <p id="msg">YouTube açılıyor…</p>
  <a class="sub" id="sub" href="https://www.youtube.com/@tunckurtmatematik?sub_confirmation=1">Kanala abone ol</a>
</div>
<script>
// Kullanım: /izle/?v=VIDEO_ID   (abone için ?sub=1)
(function(){
  var q=new URLSearchParams(location.search), v=q.get("v")||"", ua=navigator.userAgent||"";
  var ok=/^[A-Za-z0-9_-]{11}$/.test(v);
  var web= ok ? "https://www.youtube.com/watch?v="+v : (q.get("sub")?"https://www.youtube.com/@tunckurtmatematik?sub_confirmation=1":"https://www.youtube.com/@tunckurtmatematik");
  var path= web.replace("https://","");
  var android=/Android/i.test(ua), ios=/iPhone|iPad|iPod/i.test(ua);
  var app = android ? "intent://"+path+"#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url="+encodeURIComponent(web)+";end"
          : ios ? "youtube://"+path : web;
  var go=document.getElementById("go"); go.href=app;
  if(ok){var th=document.getElementById("th"); th.src="https://i.ytimg.com/vi/"+v+"/hqdefault.jpg";}
  else{document.getElementById("th").style.display="none";}
  if(!android&&!ios){location.replace(web);return}
  location.href=app;
  setTimeout(function(){document.getElementById("msg").textContent="Açılmadıysa yukarıdaki düğmeye dokunun.";},1200);
})();
</script>
</body>
</html>
